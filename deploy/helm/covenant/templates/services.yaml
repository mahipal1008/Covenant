apiVersion: v1
kind: Service
metadata:
  name: {{ include "covenant.fullname" . }}-api
  labels:
    {{- include "covenant.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.api.port }}
      targetPort: http
  selector:
    app.kubernetes.io/name: {{ include "covenant.name" . }}
    app.kubernetes.io/component: api
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "covenant.fullname" . }}-web
  labels:
    {{- include "covenant.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.web.port }}
      targetPort: http
  selector:
    app.kubernetes.io/name: {{ include "covenant.name" . }}
    app.kubernetes.io/component: web
{{- if .Values.serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "covenant.serviceAccountName" . }}
  labels:
    {{- include "covenant.labels" . | nindent 4 }}
{{- end }}
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "covenant.fullname" . }}
  labels:
    {{- include "covenant.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.apiHost | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "covenant.fullname" . }}-api
                port: { number: {{ .Values.api.port }} }
    - host: {{ .Values.ingress.webHost | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "covenant.fullname" . }}-web
                port: { number: {{ .Values.web.port }} }
{{- end }}
