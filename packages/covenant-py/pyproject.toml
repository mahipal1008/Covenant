[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "covenant"
version = "0.1.0"
description = "Covenant Python SDK — programmatic access to scans, findings, intent contracts, and audit trails."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Covenant", email = "hello@covenant.dev" }]
requires-python = ">=3.10"
keywords = ["covenant", "security", "saas", "tenant-isolation", "static-analysis"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
  "Typing :: Typed"
]
dependencies = [
  "httpx>=0.27,<1.0"
]

[project.urls]
Homepage = "https://covenant.dev"
Documentation = "https://covenant.dev/docs"
Repository = "https://github.com/covenantdev/covenant"
Issues = "https://github.com/covenantdev/covenant/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
  "mypy>=1.10"
]

[tool.hatch.build.targets.wheel]
packages = ["src/covenant"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
strict = true
python_version = "3.10"
